server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
    }

    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Proxy ML service paths used by the dashboard
    location /health {
        proxy_pass http://ml-service:8000/health;
    }
    location /market/ {
        proxy_pass http://ml-service:8000/market/;
    }
    location /features/ {
        proxy_pass http://ml-service:8000/features/;
    }
    location /backtest/ {
        proxy_pass http://ml-service:8000/backtest/;
    }
    location /news/ {
        proxy_pass http://ml-service:8000/news/;
    }
    location /options/ {
        proxy_pass http://ml-service:8000/options/;
    }
    location /portfolio/ {
        proxy_pass http://ml-service:8000/portfolio/;
    }
    location /automation/ {
        proxy_pass http://ml-service:8000/automation/;
    }
    location /models/ {
        proxy_pass http://ml-service:8000/models/;
    }
}
